    const dt = Math.min(0.05, t - this.last); this.last = t;
    const k = this.props.intensity ?? 1;
    const m = this.m, rm = this.rm;
    m.x += (m.tx - m.x) * 0.06; m.y += (m.ty - m.y) * 0.06;
    const el = t - this.t0;
    for (const o of this.objs) {
      const p = rm ? 1 : Math.min(1, Math.max(0, (el - o.delay) / 1.1));
      const e = 1 - Math.pow(1 - p, 3);
      const fl = rm ? 0 : Math.sin(t * 0.7 + o.ph) * 7 * o.d * k;
      const dx = o.cx - m.px, dy = o.cy - m.py, dist = Math.hypot(dx, dy) || 1;
      const f = Math.max(0, 1 - dist / (o.r + 160)) * (rm ? 0 : 1);
      o.pxv += ((dx / dist) * f * 22 * o.d * k - o.pxv) * 0.08;
      o.pyv += ((dy / dist) * f * 22 * o.d * k - o.pyv) * 0.08;
      const X = -m.x * o.d * 34 * k + o.pxv;
      const Y = -m.y * o.d * 22 * k + fl + o.pyv + (1 - e) * 90 * (0.5 + o.d);
      const wob = rm ? 0 : Math.sin(t * 0.5 + o.ph * 1.3);
      const dw = (0.75 + o.d * 0.85) * (+o.el.dataset.tw || 1);
      const ry = (m.x * 16 * dw + wob * 3 * dw + f * (dx / dist) * -10 * dw) * k, rx = (-m.y * 12 * dw + (rm ? 0 : Math.cos(t * 0.45 + o.ph)) * 2 * dw + f * (dy / dist) * 8 * dw) * k;
      o.el.style.opacity = e;
      o.body.style.transform = `translate3d(${X.toFixed(2)}px,${Y.toFixed(2)}px,0) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${(0.9 + 0.1 * e).toFixed(4)})`;
      const th = (5 + o.d * 7) * k;
      o.edge.style.transform = `translateZ(${(-th).toFixed(2)}px)`;
      if (o.layers) for (const L of o.layers) L.el.style.transform = `translateZ(${(-th * L.f).toFixed(2)}px)`;
      const lift = 18 + o.d * 26 + (1 - e) * 40;
      o.shadow.style.transform = `translate(${(X * 0.35 - m.x * 16 * o.d * k).toFixed(2)}px,${(Y * 0.25 + lift).toFixed(2)}px) scale(${(0.96 - (1 - e) * 0.1).toFixed(3)})`;
    }
    const h = this.hNav;
    const nIntro = rm ? 1 : Math.min(1, Math.max(0, (el - 0.5) / 0.6));
    this.navs.forEach((n, i) => {
      const d = Math.abs(i - h);
      const tx = (h < 0 ? 0 : i === h ? 8 : 3 / d) + n.ix * nIntro + (1 - nIntro) * -60;
      const ty = h === i ? -1.5 : 0;
      const tr = h < 0 ? n.base : i === h ? n.base * 0.15 : n.base + (i < h ? -1 : 1) * (0.6 / d);
      n.vx = (n.vx + (tx - n.x) * 0.14) * 0.72; n.x += n.vx;
      n.vy = (n.vy + (ty - n.y) * 0.14) * 0.72; n.y += n.vy;
      n.vr = (n.vr + (tr - n.r) * 0.14) * 0.72; n.r += n.vr;
      let tRy = 0, tRx = 0;
      if (i === h) {
        const r = n.el.getBoundingClientRect();
        tRy = ((m.px - (r.left + r.width / 2)) / r.width) * 8;
        tRx = -((m.py - (r.top + r.height / 2)) / r.height) * 9;
      }
      n.ry = (n.ry || 0) + (tRy - (n.ry || 0)) * 0.14; n.rx = (n.rx || 0) + (tRx - (n.rx || 0)) * 0.14;
      n.el.style.transform = `perspective(600px) translate(${n.x.toFixed(2)}px,${n.y.toFixed(2)}px) rotate(${n.r.toFixed(2)}deg) rotateY(${n.ry.toFixed(2)}deg) rotateX(${n.rx.toFixed(2)}deg)`;
      n.el.style.opacity = Math.min(1, nIntro * 1.5);
    });
    if (this.rail.style.display !== 'none') {
      const drift = (this.props.railDrift ?? true) && !rm && !this.overRail ? 20 : 0;
      this.vel *= 0.9;
      this.scroll += drift * dt + this.vel * dt;
      const cs = this.cards, hn = cs.length >> 1;
      const half = hn > 0 ? cs[hn].el.offsetTop - cs[0].el.offsetTop : this.track.scrollHeight / 2;
      if (half > 0) { this.scroll = ((this.scroll % half) + half) % half; }
      this.track.style.transform = `translate3d(0,${(-this.scroll).toFixed(2)}px,0)`;
      const vh = innerHeight;
      for (const c of this.cards) {
        const r = c.el.getBoundingClientRect();
        if (r.bottom < -100 || r.top > vh + 100) continue;
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const hov = this.hCard === c.el;
        const cyn = (cy / vh) * 2 - 1;
        const tRy = hov ? ((m.px - cx) / r.width) * 18 : -16;
        const tRx = hov ? -((m.py - cy) / r.height) * 14 : -cyn * 16 * k;
        const tZ = hov ? 46 : 0;
        c.ry += (tRy - c.ry) * 0.12; c.rx += (tRx - c.rx) * 0.12; c.z += (tZ - c.z) * 0.14; c.c += ((hov ? 1 : 0) - c.c) * 0.16;
        c.tilt.style.transform = `translateZ(${c.z.toFixed(2)}px) rotateY(${c.ry.toFixed(2)}deg) rotateX(${c.rx.toFixed(2)}deg)`;
        c.cap.style.opacity = c.c.toFixed(3);
        c.cap.style.transform = `translateZ(${(36 + c.c * 14).toFixed(1)}px) translateY(${((1 - c.c) * 8).toFixed(1)}px)`;
      }
    }
  }
}
</script>
